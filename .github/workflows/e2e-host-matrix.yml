name: e2e-host-matrix

# ADR-490: host x assertion matrix for Claude Code, Codex and OpenRouter against the real ruflo CLI and MCP server.
# This workflow runs the KEYLESS mode only: no model call, no secret, $0. Live mode (RUFLO_E2E_LIVE=1) is run by hand.
# Codex is pinned to 0.162.0 (0.162.1 crashes with a #GP). No Claude Code binary is needed for the keyless legs.

on:
  pull_request:
    paths:
      - 'scripts/e2e/**'
      - 'v3/@claude-flow/cli/bin/**'
      - 'v3/@claude-flow/cli/src/mcp-server.ts'
      - 'v3/@claude-flow/codex/src/**'
      - '.github/workflows/e2e-host-matrix.yml'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

jobs:
  keyless:
    name: e2e host matrix (keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: '8'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: v3/pnpm-lock.yaml
      - name: Install workspace
        working-directory: v3
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the CLI and what it imports
        working-directory: v3
        run: |
          for p in shared security mcp swarm; do (cd @claude-flow/$p && pnpm run build); done
          (cd @claude-flow/cli && pnpm run build)
      - name: Install the pinned Codex (0.162.0)
        run: |
          npm install -g @openai/codex@0.162.0
          codex --version
          echo "RUFLO_E2E_CODEX_BIN=$(command -v codex)" >> "$GITHUB_ENV"
      - name: Matrix (keyless)
        run: node scripts/e2e/host-matrix.mjs --cli-path "$PWD/v3/@claude-flow/cli/bin/cli.js" --json e2e-matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-matrix
          path: e2e-matrix.json
          retention-days: 30
