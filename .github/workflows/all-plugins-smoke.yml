# Meta-smoke: run every plugins/*/scripts/smoke.sh in parallel and fail the
# build if any plugin's structural contract regresses.
#
# Before iter 74, only ruflo-cost-tracker and ruflo-agent had dedicated CI
# gates — the other 30 plugins shipped smoke.sh files that nobody enforced.
# This workflow turns the 32 unrelated smoke scripts into a single
# CI-gateable check. New plugins authored with the canonical scripts/smoke.sh
# layout are automatically covered.
#
# Triggers on any plugin change (paths-filter) and is fast enough (~8s wall
# on the iter-74 baseline) that it can be a required check on PRs.
name: all-plugins-smoke

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/marketplace.json'
      - 'scripts/smoke-all-plugins.mjs'
      - 'scripts/external-plugins.mjs'
      - 'tests/external-plugins.test.mjs'
      - '.github/workflows/validate-marketplace.yml'
      - 'scripts/audit-plugin-mcp-prefix.mjs'
      - 'scripts/audit-skill-mcp-tools.mjs'
      - 'verification/skill-mcp-tool-baseline.json'
      - 'v3/@claude-flow/cli/.claude/skills/**'
      - 'scripts/check-plugin-manifests.mjs'
      - 'scripts/sync-mod-screen.mjs'
      - 'scripts/check-guard-tool-names.mjs'
      - 'scripts/guard-tool-names.allow.json'
      - 'scripts/check-status-forwarding.mjs'
      - 'scripts/status-forwarding.allow.json'
      - 'v3/@claude-flow/cli/src/mcp-tools/**'
      - 'v3/@claude-flow/cli/src/ruvector/coverage-tools.ts'
      - '.github/workflows/all-plugins-smoke.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - '.claude-plugin/marketplace.json'
      - 'scripts/smoke-all-plugins.mjs'
      - 'scripts/external-plugins.mjs'
      - 'tests/external-plugins.test.mjs'
      - '.github/workflows/validate-marketplace.yml'
      - 'scripts/audit-plugin-mcp-prefix.mjs'
      - 'scripts/audit-skill-mcp-tools.mjs'
      - 'verification/skill-mcp-tool-baseline.json'
      - 'v3/@claude-flow/cli/.claude/skills/**'
      - 'scripts/check-plugin-manifests.mjs'
      - 'scripts/sync-mod-screen.mjs'
      - 'scripts/check-guard-tool-names.mjs'
      - 'scripts/guard-tool-names.allow.json'
      - 'scripts/check-status-forwarding.mjs'
      - 'scripts/status-forwarding.allow.json'
      - 'v3/@claude-flow/cli/src/mcp-tools/**'
      - 'v3/@claude-flow/cli/src/ruvector/coverage-tools.ts'
      - '.github/workflows/all-plugins-smoke.yml'
  workflow_dispatch:

# The external-plugin smoke runs third-party code (scripts/external-plugins.mjs): the token can only read, and no checkout
# keeps credentials in the workspace.
permissions:
  contents: read

jobs:
  smoke-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: esbuild for the guard probe (scripts/probe-mod-guards.mjs bundles each plugin guard)
        run: |
          npm install --prefix "$RUNNER_TEMP/esbuild" --no-audit --no-fund --no-package-lock esbuild@0.25.0 yaml@2.8.0
          echo "ESBUILD=$RUNNER_TEMP/esbuild/node_modules/.bin/esbuild" >> "$GITHUB_ENV"
      - name: External plugin checks (github-only source, realpath containment, scrubbed env and cwd)
        run: node --test tests/external-plugins.test.mjs

      - name: Discover and run every plugin smoke contract (parallel)
        # --timeout 300 caps each individual plugin smoke at 5 minutes.
        # iter 119 — bumped from 60s because ruflo-metaharness has grown
        # to 118 steps with many npx invocations and routinely exceeds
        # 60s (was timing out at 151s before SIGKILL). Most plugins
        # still complete in <5s; 300s protects against a genuinely-hung
        # smoke while letting the metaharness fleet finish.
        # Save the report from the same execution. Re-running the whole fleet
        # solely to obtain JSON can exceed this job's ten-minute deadline.
        # Explicit bash and pipefail preserve a failing smoke exit through tee.
        shell: bash
        run: |-
          set -o pipefail
          node scripts/smoke-all-plugins.mjs --timeout 300 --format json | tee /tmp/smoke-all-plugins.json

      - name: Mod secret screen — every copy matches the origin (ADR-445)
        run: node scripts/sync-mod-screen.mjs --check
        # Fails when any plugins/*/hooks/screen.ts drifted from plugins/ruflo-agentdb/hooks/screen.ts between the
        # SHARED SCREEN markers, or when it finds no copies. Fix: node scripts/sync-mod-screen.mjs
      - name: Guard tool names exist in the registry
        env:
          NODE_PATH: ${{ runner.temp }}/esbuild/node_modules
        run: |
          node --test tests/check-guard-tool-names.test.mjs tests/all-plugins-smoke-workflow.test.mjs
          node scripts/check-guard-tool-names.mjs
        # A renamed MCP tool leaves a plugin guard watching a name that no
        # longer exists, so it silently stops guarding. Fails loud if zero
        # names are extracted or the registry is empty.

      - name: Native Codex hooks for adr, ddd and sparc (bundles match their sources)
        run: |
          node scripts/build-codex-mod-hooks.mjs --check
          node --test tests/plugins/codex-mod-hooks.test.mjs

      - name: No mod forwards another mod's status file into model context (ADR-450 T7)
        run: |
          node --test tests/check-status-forwarding.test.mjs
          node scripts/check-status-forwarding.mjs
        # Static scan of plugins/*/hooks: fails when a module that attaches model context (context, instructions,
        # additionalContext, describe) also reads a mod status path, unless scripts/status-forwarding.allow.json says why.
        # Exits 3 when it scans no context-bearing module, so an emptied scan fails loud.

      - name: Fleet-wide exit-bypass antipattern lint (iter-75 bug class)
        run: node scripts/audit-exit-bypass-antipattern.mjs
        # Static analyzer: scans every plugins/*/scripts/*.mjs for the
        # iter-75 antipattern — `return console.log(JSON.stringify(...))`
        # placed BEFORE a `process.exit(N>0)` in the same function (which
        # silently swallows the exit signal). Use the inline marker
        # `// audit-allow: exit-bypass — <reason>` to suppress known-safe
        # cases (e.g. early returns on no-config paths that can't reach
        # the exit).

      - name: Fleet-wide SKILL.md frontmatter audit (iter 87)
        run: node scripts/audit-skill-frontmatter.mjs
        # Scans every plugins/*/skills/*/SKILL.md for required frontmatter:
        # name / description / allowed-tools all present and non-empty,
        # no wildcard allowed-tools (security), name matches directory.
        # Each plugin's own smoke checks its own skills; this catches
        # violations that escape per-plugin coverage (new plugin without
        # smoke, new skill without smoke-list update, etc.).

      - name: claude.ai plugin-validator static check
        run: node scripts/check-plugin-manifests.mjs
        # Unknown plugin.json keys, nested .claude-plugin/plugin.json under a
        # plugin, and <tag>-like text in SKILL.md descriptions: the three
        # things the claude.ai upload validator skips or warns on.

      - name: Fleet-wide plugin.json manifest audit (iter 88)
        run: node scripts/audit-plugin-manifest.mjs
        # Scans every plugins/*/.claude-plugin/plugin.json for: valid JSON,
        # required fields (name/version/description/keywords[]) present
        # and non-empty, version matches semver X.Y.Z, name matches
        # enclosing directory. Each plugin's smoke step 1 pins its own
        # expected version literal; this catches structural violations
        # (non-semver, name drift, missing fields) that the per-plugin
        # grep can't see.

      - name: Fleet-wide plugin MCP namespace audit
        run: node scripts/audit-plugin-mcp-prefix.mjs
        # Claude marketplace plugins expose the ruflo MCP server under the
        # plugin-qualified namespace. Reject standalone namespace references
        # that silently disable tools in plugin skills and agents.

      - name: Skill MCP tool reference audit
        run: node scripts/audit-skill-mcp-tools.mjs
        # Every ruflo MCP tool a shipped SKILL.md names (init bundle and
        # marketplace plugins, prose and allowed-tools) must be registered by
        # mcp-client.ts. Known dangling references are carried in
        # verification/skill-mcp-tool-baseline.json; a new one fails. After
        # fixing some, run with --update-baseline to lower the floor.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-plugins-smoke-report
          path: /tmp/smoke-all-plugins.json
          retention-days: 30
