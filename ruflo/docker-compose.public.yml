# Optional public deployment override.
# Use: docker compose -f docker-compose.yml -f docker-compose.public.yml up -d
#
# The base compose keeps the bridge unpublished (compose-network only) and
# already requires MCP_AUTH_TOKEN. This override PUBLISHES port 3001 on the
# host — only do this deliberately (ADR-166 "optional public deployment
# pattern"). Set in .env or your secrets manager:
#   MCP_AUTH_TOKEN=<base64 token, >=32 bytes; openssl rand -base64 32>
#   MCP_PUBLIC_HOST_IP=<host interface to publish on; default 0.0.0.0>
services:
  mcp-bridge:
    ports:
      - "${MCP_PUBLIC_HOST_IP:-0.0.0.0}:3001:3001"
    environment:
      # Container-internal bind stays 0.0.0.0 (inherited from base); the
      # fail-closed gate requires MCP_AUTH_TOKEN, which the base enforces.
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN}"
  mongodb:
    # Public deployment uses stronger Mongo isolation — auth + non-mapped host port.
    # `!override` is required: a plain empty list MERGES with (i.e. keeps) the
    # base mapping instead of removing it.
    ports: !override []  # remove the host port mapping; access only over the docker network
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD}"
