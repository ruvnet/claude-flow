<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">What an agent harness does, in plain language</title><desc id="desc">A person sets a goal. The harness coordinates planning, Claude Code work and checks. Feedback can guide another attempt. Illustrative concept only; it does not show a live run or prove historical functionality.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111c31"/><stop offset="1" stop-color="#070c16"/></linearGradient><linearGradient id="line"><stop stop-color="#51e5d0"/><stop offset="1" stop-color="#ad99ff"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.signal{stroke-dasharray:36 240;animation:travel 7s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-552}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="958" height="428" rx="24" fill="url(#bg)" stroke="#34445d"/><text x="40" y="48" fill="#51e5d0" font-size="14" letter-spacing="3">WHAT IS A HARNESS?</text><text x="40" y="92" fill="#f1f6ff" font-size="32" font-weight="700">The workbench around the model.</text><text x="40" y="124" fill="#b5c4d8" font-size="17">You set the goal. It organizes the work and keeps the feedback.</text><rect x="260" y="153" width="660" height="182" rx="20" fill="#101d30" stroke="#ad99ff"/><text x="282" y="180" fill="#ad99ff" font-size="13" letter-spacing="2">HARNESS · COORDINATION + CONTEXT + CHECKS</text><path d="M196 246H818" stroke="#34445d" stroke-width="3"/><path class="signal" d="M196 246H818" stroke="url(#line)" stroke-width="3" fill="none"/>
<g fill="#13283a" stroke="#51e5d0"><rect x="40" y="205" width="156" height="82" rx="14"/><rect x="282" y="205" width="156" height="82" rx="14"/><rect x="512" y="205" width="156" height="82" rx="14"/><rect x="742" y="205" width="156" height="82" rx="14"/></g><g fill="#f1f6ff" text-anchor="middle" font-size="21" font-weight="700"><text x="118" y="240">Your goal</text><text x="360" y="240">Plan</text><text x="590" y="240">Do</text><text x="820" y="240">Check</text></g><g fill="#b5c4d8" text-anchor="middle" font-size="14"><text x="118" y="266">What should change?</text><text x="360" y="266">Divide the task</text><text x="590" y="266">Claude Code works</text><text x="820" y="266">Inspect the result</text></g><path d="M820 288V313H360V288" fill="none" stroke="#ad99ff" stroke-width="2"/><path class="signal" d="M820 288V313H360V288" fill="none" stroke="#51e5d0" stroke-width="2"/><circle class="pulse" cx="590" cy="313" r="5" fill="#51e5d0"/><text x="40" y="375" fill="#f1f6ff" font-size="18">Remember useful context. Try again when needed. Keep the person in control.</text><text x="40" y="404" fill="#b5c4d8" font-size="14">Concept illustration. Actual execution, permissions and checks depend on the installed integration.</text></svg>
