<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">From Claude Flow to Ruflo: an origin you can inspect</title><desc id="desc">June 2, 2025: rUv records the recursive orchestration idea. June 10: orchestration source is added. Today: Ruflo continues that lineage. Diagram is a historical illustration, not a runtime recording.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111c31"/><stop offset="1" stop-color="#070c16"/></linearGradient><linearGradient id="line"><stop stop-color="#51e5d0"/><stop offset="1" stop-color="#ad99ff"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.signal{stroke-dasharray:36 240;animation:travel 7s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-552}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="958" height="568" rx="24" fill="url(#bg)" stroke="#34445d"/><g fill="none" stroke="#22324b" opacity=".5"><path d="M40 140H920M40 180H920M40 220H920M40 260H920M40 300H920M40 340H920M40 380H920M40 420H920M40 460H920M40 500H920"/></g><text x="44" y="48" fill="#51e5d0" font-size="14" letter-spacing="3">THE ORIGIN IS IN THE COMMITS</text><text x="44" y="94" fill="#f1f6ff" font-size="34" font-weight="700">One idea. A continuing lineage.</text><text x="44" y="124" fill="#b5c4d8" font-size="17">Created by Reuven Cohen · rUv · github.com/ruvnet</text><path d="M130 249H830" stroke="#34445d" stroke-width="3"/><path class="signal" d="M130 249H830" stroke="url(#line)" stroke-width="3" fill="none"/>
<g class="float"><path d="M95 197L130 178L165 197V237L130 256L95 237Z" fill="#102d34" stroke="#51e5d0" stroke-width="2"/><path d="M95 197L130 217L165 197M130 217V256" fill="none" stroke="#51e5d0"/><circle class="pulse" cx="130" cy="217" r="5" fill="#51e5d0"/></g>
<g class="float" style="animation-delay:-2s" fill="#16243e" stroke="#80b7ff" stroke-width="2"><path d="M445 214L480 180L515 214L480 248Z"/><path d="M445 214L480 231L515 214M480 180V248"/><circle cx="445" cy="214" r="5"/><circle cx="515" cy="214" r="5"/></g>
