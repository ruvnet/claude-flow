<g fill="#f1f6ff" font-size="22" font-weight="700"><text x="44" y="304">June 2, 2025</text><text x="365" y="304">June 10, 2025</text><text x="694" y="304">Ruflo today</text></g>
<g fill="#b5c4d8" font-size="17"><text x="44" y="340">The founding idea</text><text x="44" y="368">Claude writes, edits, tests</text><text x="44" y="394">and improves in a loop.</text><text x="365" y="340">The system takes shape</text><text x="365" y="368">Agent roles, task queues,</text><text x="365" y="394">memory and terminal code.</text><text x="694" y="340">The lineage continues</text><text x="694" y="368">Claude Flow evolves</text><text x="694" y="394">into the Ruflo harness.</text></g>
<g font-size="15" font-family="monospace" fill="#51e5d0"><text x="44" y="433">7c1f9402</text><text x="365" y="433">dba545f0</text><text x="694" y="433">Same repository history</text></g><rect x="30" y="468" width="900" height="73" rx="12" fill="#121f33" stroke="#34445d"/><text x="48" y="497" fill="#f1f6ff" font-size="17">A dated origin you can verify. An idea is different from a working release.</text><text x="48" y="523" fill="#b5c4d8" font-size="15">Commit links and limits of the historical claim are explained below.</text></svg>
