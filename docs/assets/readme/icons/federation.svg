<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="federation"><style>.pulse{animation:p 3s ease-in-out infinite}.blink{animation:p 2s ease-in-out infinite}.orbit{transform-origin:20px 20px;animation:r 14s linear infinite}.signal{stroke-dasharray:50;animation:s 4s ease-in-out infinite}.scan{animation:t 3s ease-in-out infinite}@keyframes p{50%{opacity:.3}}@keyframes r{to{transform:rotate(360deg)}}@keyframes s{0%{stroke-dashoffset:50}65%,100%{stroke-dashoffset:0}}@keyframes t{50%{transform:translateY(11px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="40" height="40" rx="9" fill="#0b1726"/><g fill="none" stroke="#42e8ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="14"/><ellipse class="pulse" cx="20" cy="20" rx="7" ry="14"/><path d="M6 20h28M9 12h22M9 28h22"/></g></svg>