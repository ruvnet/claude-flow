<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="plugins"><style>.pulse{animation:p 3s ease-in-out infinite}.blink{animation:p 2s ease-in-out infinite}.orbit{transform-origin:20px 20px;animation:r 14s linear infinite}.signal{stroke-dasharray:50;animation:s 4s ease-in-out infinite}.scan{animation:t 3s ease-in-out infinite}@keyframes p{50%{opacity:.3}}@keyframes r{to{transform:rotate(360deg)}}@keyframes s{0%{stroke-dashoffset:50}65%,100%{stroke-dashoffset:0}}@keyframes t{50%{transform:translateY(11px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="40" height="40" rx="9" fill="#0b1726"/><g fill="none" stroke="#bb92ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7v8M27 7v8M10 15h20v5c0 8-20 8-20 0zM20 26v9"/><circle class="pulse" cx="20" cy="20" r="2"/></g></svg>