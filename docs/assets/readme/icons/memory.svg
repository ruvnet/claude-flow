<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="memory"><style>.pulse{animation:p 3s ease-in-out infinite}.blink{animation:p 2s ease-in-out infinite}.orbit{transform-origin:20px 20px;animation:r 14s linear infinite}.signal{stroke-dasharray:50;animation:s 4s ease-in-out infinite}.scan{animation:t 3s ease-in-out infinite}@keyframes p{50%{opacity:.3}}@keyframes r{to{transform:rotate(360deg)}}@keyframes s{0%{stroke-dashoffset:50}65%,100%{stroke-dashoffset:0}}@keyframes t{50%{transform:translateY(11px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="40" height="40" rx="9" fill="#0b1726"/><g fill="none" stroke="#42e8ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="20" cy="9" rx="12" ry="5"/><path d="M8 9v22c0 7 24 7 24 0V9M8 20c0 7 24 7 24 0"/><path class="scan" d="M12 14h16"/></g></svg>